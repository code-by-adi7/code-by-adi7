<svg viewBox="0 0 700 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .prompt { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 20px; fill: #5fb3a3; }
      .txt { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 20px; fill: #e8ece9; }
    </style>
  </defs>

  <rect x="0" y="0" width="700" height="60" rx="8" fill="#0a0e11" stroke="#1f2a2e"/>

  <text x="18" y="36" class="prompt">&gt;</text>

  <!-- Phrase 1 -->
  <text x="42" y="36" class="txt">
    <animate attributeName="opacity"
      values="0;1;1;0;0;0" keyTimes="0;0.03;0.30;0.33;0.99;1"
      dur="9s" repeatCount="indefinite"/>
    BCA student, always shipping something
  </text>

  <!-- Phrase 2 -->
  <text x="42" y="36" class="txt">
    <animate attributeName="opacity"
      values="0;0;0;1;1;0;0" keyTimes="0;0.33;0.36;0.39;0.63;0.66;1"
      dur="9s" repeatCount="indefinite"/>
    C · C++ · Python · Java · JS/TS
  </text>

  <!-- Phrase 3 -->
  <text x="42" y="36" class="txt">
    <animate attributeName="opacity"
      values="0;0;0;1;1;0" keyTimes="0;0.66;0.69;0.72;0.99;1"
      dur="9s" repeatCount="indefinite"/>
    building web apps, one commit at a time
  </text>

  <rect x="26" y="18" width="9" height="22" fill="#5fb3a3">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
