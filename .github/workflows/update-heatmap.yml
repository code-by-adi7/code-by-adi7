name: Update profile cards

on:
  schedule:
    - cron: "0 3 * * *"   # every day at 03:00 UTC
  workflow_dispatch: {}    # allow manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install Pillow

      - name: Generate portrait (with glitch avatar)
        env:
          GH_USERNAME: code-by-adi7
        run: python3 scripts/generate_portrait_gif.py

      - name: Generate contribution heatmap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: code-by-adi7
        run: node scripts/generate_heatmap.js

      - name: Generate stats card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: code-by-adi7
        run: node scripts/generate_stats.js

      - name: Generate languages card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: code-by-adi7
        run: node scripts/generate_languages.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contrib-heatmap.svg stats-card.svg languages-card.svg portrait.gif
          git diff --staged --quiet || git commit -m "chore: update profile cards"
          git pull --rebase origin main
          git push
